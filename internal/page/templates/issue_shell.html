<!DOCTYPE html>
<html lang="en">
<head>
  {{template "head" .Meta}}
  <title>{{.Identifier}} — Miren</title>
</head>
<body>
  {{template "header"}}
  <main data-issue-shell="{{.Identifier}}">
    <article class="issue issue-shell" aria-busy="true">
      <span class="issue-identifier">{{.Identifier}}</span>
      <div class="skeleton skeleton-title" aria-hidden="true"></div>
      <div class="skeleton skeleton-meta" aria-hidden="true"></div>
      {{template "linear-status"}}
      <noscript><p class="linear-status" data-state="error">Linear is taking a while with this one. Reload in a moment to see it.</p></noscript>
      <div class="skeleton skeleton-line" aria-hidden="true"></div>
      <div class="skeleton skeleton-line" aria-hidden="true"></div>
      <div class="skeleton skeleton-line skeleton-line-short" aria-hidden="true"></div>
    </article>
  </main>
  {{template "footer"}}
  <script src="/static/linear.js"></script>
  <script src="/static/issue-shell.js"></script>
</body>
</html>
